name: Build wasmcart-native

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # v26.3.0-jsg10 adds libnode-windows-aarch64.zip; it must be released before
  # this repo is pushed or tagged.
  LIBNODE_VERSION: v26.3.0-jsg10
  # WebGPU (every job): native-dawn's release archive for the
  # platform (sha256 pinned in scripts/fetch-wgpu-deps.sh) and wasmcart's
  # src/wgpu from its npm package, exactly this version. RELEASE ORDER: the
  # wasmcart release (v$WASMCART_VERSION pushed and published to npm) comes
  # first; only then push/tag this repo, or the WebGPU jobs fail at "Fetch
  # WebGPU support" because `npm pack wasmcart@$WASMCART_VERSION` finds nothing.
  # native-dawn 0.1.2 is the first whose Windows dawn.node loads outside
  # node.exe; its release, and its hashes pinned in the fetch script, also
  # come first (the script refuses the placeholders).
  NATIVE_DAWN_VERSION: 0.1.2
  WASMCART_VERSION: 0.32.0

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y cmake g++ \
            libsdl2-dev libegl-dev libgles-dev \
            libasound2-dev libpulse-dev libsamplerate0-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev libdrm-dev libgbm-dev \
            mesa-vulkan-drivers
      - name: Download libnode
        run: |
          mkdir -p deps/libnode
          curl -sL https://github.com/wasmcart/build-libnode/releases/download/${{ env.LIBNODE_VERSION }}/libnode-linux-x86_64.tar.gz | tar xz -C deps/libnode
      - name: Fetch WebGPU support
        run: sh scripts/fetch-wgpu-deps.sh linux-x64 deps/wgpu
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DWASMCART_WGPU_JS_DIR=$GITHUB_WORKSPACE/deps/wgpu/wasmcart/src/wgpu \
                   -DNATIVE_DAWN_DIR=$GITHUB_WORKSPACE/deps/wgpu/native-dawn
          make -j$(nproc)
      - name: Smoke test
        run: |
          # V8 + WASM init test — SDL will fail (no display) but cart should load
          # A plain kill+wait is NOT enough here: libnode/V8 can still be
          # tearing down when the Package step runs strip on the same file,
          # which fails with "Text file busy" -- that has been breaking Package
          # on every push. Strip here instead, retrying until the binary is
          # actually writable, so Package finds it already stripped.
          # POLL for the success line instead of sleeping a fixed 3s. V8 init on
          # a loaded aarch64 runner can exceed 3s, which made this fail on a
          # commit that had passed minutes earlier -- a flake, not a regression.
          # Waiting up to 60s costs nothing when the cart loads in ~1s.
          build/wasmcart-run test/snake.wasc > /tmp/smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 300); do
            grep -q "loaded snake" /tmp/smoke.log && break
            kill -0 $PID 2>/dev/null || break   # process died; stop waiting
            sleep 0.2
          done
          kill $PID 2>/dev/null
          wait $PID 2>/dev/null || true
          # Strip here, retrying until the binary is writable: libnode/V8 can
          # still be unmapping when Package would otherwise strip it, which
          # fails with "Text file busy".
          for i in $(seq 1 50); do
            strip build/wasmcart-run 2>/dev/null && break
            sleep 0.2
          done
          if grep -q "loaded snake" /tmp/smoke.log; then
            echo "PASS: V8 initialized, cart loaded"
          else
            echo "FAIL: cart did not load"
            cat /tmp/smoke.log
            exit 1
          fi
      # The full WebGPU suite on the stripped binary that ships. The runner
      # has no GPU: mesa-vulkan-drivers (above) brings lavapipe, a software
      # Vulkan driver, which Dawn uses as its adapter.
      - name: WebGPU tests
        run: sh test/wgpu_test.sh build/wasmcart-run
      - name: Package
        run: |
          strip build/wasmcart-run || true   # already stripped in Smoke test
          tar czf wasmcart-native-linux-x86_64.tar.gz -C build wasmcart-run wgpu
      - uses: actions/upload-artifact@v7
        with:
          name: wasmcart-native-linux-x86_64
          path: wasmcart-native-linux-x86_64.tar.gz

  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y cmake g++ \
            libsdl2-dev libegl-dev libgles-dev \
            libasound2-dev libpulse-dev libsamplerate0-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev libdrm-dev libgbm-dev \
            mesa-vulkan-drivers
      - name: Download libnode
        run: |
          mkdir -p deps/libnode
          curl -sL https://github.com/wasmcart/build-libnode/releases/download/${{ env.LIBNODE_VERSION }}/libnode-linux-aarch64.tar.gz | tar xz -C deps/libnode
      - name: Fetch WebGPU support
        run: sh scripts/fetch-wgpu-deps.sh linux-arm64 deps/wgpu
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DWASMCART_WGPU_JS_DIR=$GITHUB_WORKSPACE/deps/wgpu/wasmcart/src/wgpu \
                   -DNATIVE_DAWN_DIR=$GITHUB_WORKSPACE/deps/wgpu/native-dawn
          make -j$(nproc)
      - name: Smoke test
        run: |
          # A plain kill+wait is NOT enough here: libnode/V8 can still be
          # tearing down when the Package step runs strip on the same file,
          # which fails with "Text file busy" -- that has been breaking Package
          # on every push. Strip here instead, retrying until the binary is
          # actually writable, so Package finds it already stripped.
          # POLL for the success line instead of sleeping a fixed 3s. V8 init on
          # a loaded aarch64 runner can exceed 3s, which made this fail on a
          # commit that had passed minutes earlier -- a flake, not a regression.
          # Waiting up to 60s costs nothing when the cart loads in ~1s.
          build/wasmcart-run test/snake.wasc > /tmp/smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 300); do
            grep -q "loaded snake" /tmp/smoke.log && break
            kill -0 $PID 2>/dev/null || break   # process died; stop waiting
            sleep 0.2
          done
          kill $PID 2>/dev/null
          wait $PID 2>/dev/null || true
          # Strip here, retrying until the binary is writable: libnode/V8 can
          # still be unmapping when Package would otherwise strip it, which
          # fails with "Text file busy".
          for i in $(seq 1 50); do
            strip build/wasmcart-run 2>/dev/null && break
            sleep 0.2
          done
          if grep -q "loaded snake" /tmp/smoke.log; then
            echo "PASS: V8 initialized, cart loaded"
          else
            echo "FAIL: cart did not load"
            cat /tmp/smoke.log
            exit 1
          fi
      # The full WebGPU suite on the stripped binary that ships. The runner
      # has no GPU: mesa-vulkan-drivers (above) brings lavapipe, a software
      # Vulkan driver, which Dawn uses as its adapter.
      - name: WebGPU tests
        run: sh test/wgpu_test.sh build/wasmcart-run
      - name: Package
        run: |
          strip build/wasmcart-run || true   # already stripped in Smoke test
          tar czf wasmcart-native-linux-aarch64.tar.gz -C build wasmcart-run wgpu
      - uses: actions/upload-artifact@v7
        with:
          name: wasmcart-native-linux-aarch64
          path: wasmcart-native-linux-aarch64.tar.gz

  build-macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: brew install cmake sdl2
      - name: Download ANGLE
        run: |
          mkdir -p deps/angle/lib deps/angle/include
          curl -sL https://github.com/kivy/angle-builder/releases/download/chromium-7151_rev1/angle-macos-x64.tar.gz | tar xz -C deps/angle
          # Move dylibs to lib/ if at root
          find deps/angle -maxdepth 1 -name '*.dylib' -exec mv {} deps/angle/lib/ \;
      - name: Download libnode
        run: |
          mkdir -p deps/libnode
          curl -sL https://github.com/wasmcart/build-libnode/releases/download/${{ env.LIBNODE_VERSION }}/libnode-macos-x86_64.tar.gz | tar xz -C deps/libnode
      - name: Fetch WebGPU support
        run: sh scripts/fetch-wgpu-deps.sh darwin-x64 deps/wgpu
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DANGLE_DIR=../deps/angle \
                   -DWASMCART_WGPU_JS_DIR=$GITHUB_WORKSPACE/deps/wgpu/wasmcart/src/wgpu \
                   -DNATIVE_DAWN_DIR=$GITHUB_WORKSPACE/deps/wgpu/native-dawn
          make -j$(sysctl -n hw.ncpu)
          # -x: local symbols only. dawn.node resolves N-API from this
          # executable's exported globals, which a plain strip removes.
          strip -x wasmcart-run
      - name: Smoke test
        run: |
          cp deps/angle/lib/*.dylib build/
          cd build
          (./wasmcart-run ../test/snake.wasc > /tmp/smoke.log 2>&1 & PID=$!; sleep 3; kill $PID 2>/dev/null; wait $PID 2>/dev/null) || true
          if grep -q "loaded snake" /tmp/smoke.log; then
            echo "PASS: V8 initialized, cart loaded"
          else
            echo "FAIL: cart did not load"
            cat /tmp/smoke.log
            exit 1
          fi
      # The runner may have no Metal device Dawn can use: this checks that the
      # stripped binary loads its wgpu/ support (dawn.node + Dawn) and, when
      # an adapter exists, renders a WebGPU cart (test/wgpu_smoke.sh).
      - name: WebGPU smoke test
        run: sh test/wgpu_smoke.sh build/wasmcart-run
      - name: Package
        run: |
          tar czf wasmcart-native-macos-x86_64.tar.gz -C build wasmcart-run libEGL.dylib libGLESv2.dylib wgpu
      - uses: actions/upload-artifact@v7
        with:
          name: wasmcart-native-macos-x86_64
          path: wasmcart-native-macos-x86_64.tar.gz

  build-macos-aarch64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: brew install cmake sdl2
      - name: Download ANGLE
        run: |
          mkdir -p deps/angle/lib deps/angle/include
          curl -sL https://github.com/kivy/angle-builder/releases/download/chromium-7151_rev1/angle-macos-arm64.tar.gz | tar xz -C deps/angle
          find deps/angle -maxdepth 1 -name '*.dylib' -exec mv {} deps/angle/lib/ \;
      - name: Download libnode
        run: |
          mkdir -p deps/libnode
          curl -sL https://github.com/wasmcart/build-libnode/releases/download/${{ env.LIBNODE_VERSION }}/libnode-macos-aarch64.tar.gz | tar xz -C deps/libnode
      - name: Fetch WebGPU support
        run: sh scripts/fetch-wgpu-deps.sh darwin-arm64 deps/wgpu
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DANGLE_DIR=../deps/angle \
                   -DWASMCART_WGPU_JS_DIR=$GITHUB_WORKSPACE/deps/wgpu/wasmcart/src/wgpu \
                   -DNATIVE_DAWN_DIR=$GITHUB_WORKSPACE/deps/wgpu/native-dawn
          make -j$(sysctl -n hw.ncpu)
          # -x: local symbols only. dawn.node resolves N-API from this
          # executable's exported globals, which a plain strip removes.
          strip -x wasmcart-run
      - name: Smoke test
        run: |
          cp deps/angle/lib/*.dylib build/
          cd build
          (./wasmcart-run ../test/snake.wasc > /tmp/smoke.log 2>&1 & PID=$!; sleep 3; kill $PID 2>/dev/null; wait $PID 2>/dev/null) || true
          if grep -q "loaded snake" /tmp/smoke.log; then
            echo "PASS: V8 initialized, cart loaded"
          else
            echo "FAIL: cart did not load"
            cat /tmp/smoke.log
            exit 1
          fi
      # The runner may have no Metal device Dawn can use: this checks that the
      # stripped binary loads its wgpu/ support (dawn.node + Dawn) and, when
      # an adapter exists, renders a WebGPU cart (test/wgpu_smoke.sh).
      - name: WebGPU smoke test
        run: sh test/wgpu_smoke.sh build/wasmcart-run
      - name: Package
        run: |
          tar czf wasmcart-native-macos-aarch64.tar.gz -C build wasmcart-run libEGL.dylib libGLESv2.dylib wgpu
      - uses: actions/upload-artifact@v7
        with:
          name: wasmcart-native-macos-aarch64
          path: wasmcart-native-macos-aarch64.tar.gz

  build-windows-x86_64:
    # windows-2025: libnode v26 .lib needs a newer MSVC STL than windows-2022.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install SDL2
        shell: bash
        run: |
          curl -sL https://github.com/libsdl-org/SDL/releases/download/release-2.32.4/SDL2-devel-2.32.4-VC.zip -o sdl2.zip
          unzip -q sdl2.zip -d deps/
          mv deps/SDL2-2.32.4 deps/SDL2
          # Create SDL2/ subdir so #include <SDL2/SDL.h> works
          mkdir -p deps/SDL2/include/SDL2
          cp deps/SDL2/include/*.h deps/SDL2/include/SDL2/
      - name: Download ANGLE
        shell: bash
        run: |
          curl -sL https://github.com/mmozeiko/build-angle/releases/download/2026-03-01/angle-x64-2026-03-01.zip -o angle.zip
          unzip -q angle.zip -d deps/angle_tmp
          mkdir -p deps/angle/lib deps/angle/include
          # Find extracted subdir
          ADIR=$(ls deps/angle_tmp | head -1)
          cp deps/angle_tmp/$ADIR/bin/*.dll deps/angle/lib/ 2>/dev/null || true
          # Rename .dll.lib to .lib
          for f in deps/angle_tmp/$ADIR/lib/*.dll.lib; do
            newname=$(basename "$f" .dll.lib).lib
            cp "$f" "deps/angle/lib/$newname"
          done
          cp -r deps/angle_tmp/$ADIR/include/* deps/angle/include/
          rm -rf deps/angle_tmp
      - name: Download libnode
        shell: bash
        run: |
          mkdir -p deps/libnode
          curl -sL https://github.com/wasmcart/build-libnode/releases/download/${{ env.LIBNODE_VERSION }}/libnode-windows-x86_64.zip -o libnode.zip
          unzip -q libnode.zip -d deps/libnode
      - name: Fetch WebGPU support
        shell: bash
        run: sh scripts/fetch-wgpu-deps.sh win32-x64 deps/wgpu
      - name: Build
        shell: cmd
        run: |
          set "WS=%GITHUB_WORKSPACE:\=/%"
          mkdir build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL2_DIR=..\deps\SDL2 -DANGLE_DIR=..\deps\angle -DLIBNODE_DIR=..\deps\libnode -DWASMCART_WGPU_JS_DIR=%WS%/deps/wgpu/wasmcart/src/wgpu -DNATIVE_DAWN_DIR=%WS%/deps/wgpu/native-dawn
          ninja
      - name: Smoke test
        shell: bash
        run: |
          cp deps/SDL2/lib/x64/SDL2.dll build/ 2>/dev/null || true
          cp deps/angle/lib/*.dll build/ 2>/dev/null || true
          cd build
          (./wasmcart-run.exe ../test/snake.wasc > /tmp/smoke.log 2>&1 & PID=$!; sleep 3; kill $PID 2>/dev/null; wait $PID 2>/dev/null) || true
          if grep -q "loaded snake" /tmp/smoke.log; then
            echo "PASS: V8 initialized, cart loaded"
          else
            echo "FAIL: cart did not load"
            cat /tmp/smoke.log
            exit 1
          fi
      # dawn.node delay-loads Node-API from "node.exe", resolved to this
      # executable, which must export all of it.
      - name: WebGPU exports
        run: node test/wgpu_exports.mjs build/wasmcart-run.exe
      # The runner has no GPU; Dawn's D3D12 backend uses WARP, Windows'
      # software adapter. SDL's Windows build has no offscreen driver, so the
      # cart presents into a real window.
      - name: WebGPU smoke test
        shell: bash
        env:
          WGPU_SMOKE_VIDEODRIVER: windows
        run: sh test/wgpu_smoke.sh build/wasmcart-run.exe
      - name: Package
        shell: bash
        run: |
          cd build
          7z a ../wasmcart-native-windows-x86_64.zip wasmcart-run.exe SDL2.dll libEGL.dll libGLESv2.dll wgpu
      - uses: actions/upload-artifact@v7
        with:
          name: wasmcart-native-windows-x86_64
          path: wasmcart-native-windows-x86_64.zip

  build-windows-aarch64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: CMake and Ninja
        run: python -m pip install cmake==4.2.3 ninja==1.13.0
      # SDL publishes no ARM64 Windows build: build the same release from source.
      - name: Build SDL2
        shell: bash
        run: |
          curl -sfL https://github.com/libsdl-org/SDL/releases/download/release-2.32.4/SDL2-2.32.4.tar.gz | tar xz
          cmake -S SDL2-2.32.4 -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/sdl-install"
          cmake --build sdl-build
          cmake --install sdl-build
          # The VC layout the x64 job gets from SDL's release zip.
          mkdir -p deps/SDL2/include/SDL2 deps/SDL2/lib/arm64
          cp sdl-install/include/SDL2/*.h deps/SDL2/include/
          cp sdl-install/include/SDL2/*.h deps/SDL2/include/SDL2/
          cp sdl-install/lib/SDL2.lib sdl-install/lib/SDL2main.lib sdl-install/bin/SDL2.dll deps/SDL2/lib/arm64/
          rm -rf SDL2-2.32.4 sdl-build sdl-install
      - name: Download ANGLE
        shell: bash
        run: |
          curl -sL https://github.com/mmozeiko/build-angle/releases/download/2026-03-01/angle-arm64-2026-03-01.zip -o angle.zip
          unzip -q angle.zip -d deps/angle_tmp
          mkdir -p deps/angle/lib deps/angle/include
          # Find extracted subdir
          ADIR=$(ls deps/angle_tmp | head -1)
          cp deps/angle_tmp/$ADIR/bin/*.dll deps/angle/lib/ 2>/dev/null || true
          # Rename .dll.lib to .lib
          for f in deps/angle_tmp/$ADIR/lib/*.dll.lib; do
            newname=$(basename "$f" .dll.lib).lib
            cp "$f" "deps/angle/lib/$newname"
          done
          cp -r deps/angle_tmp/$ADIR/include/* deps/angle/include/
          rm -rf deps/angle_tmp
      - name: Download libnode
        shell: bash
        run: |
          mkdir -p deps/libnode
          curl -sL https://github.com/wasmcart/build-libnode/releases/download/${{ env.LIBNODE_VERSION }}/libnode-windows-aarch64.zip -o libnode.zip
          unzip -q libnode.zip -d deps/libnode
      - name: Fetch WebGPU support
        shell: bash
        run: sh scripts/fetch-wgpu-deps.sh win32-arm64 deps/wgpu
      - name: Build
        shell: cmd
        run: |
          set "WS=%GITHUB_WORKSPACE:\=/%"
          mkdir build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL2_DIR=..\deps\SDL2 -DANGLE_DIR=..\deps\angle -DLIBNODE_DIR=..\deps\libnode -DWASMCART_WGPU_JS_DIR=%WS%/deps/wgpu/wasmcart/src/wgpu -DNATIVE_DAWN_DIR=%WS%/deps/wgpu/native-dawn
          ninja
      - name: Smoke test
        shell: bash
        run: |
          cp deps/SDL2/lib/arm64/SDL2.dll build/ 2>/dev/null || true
          cp deps/angle/lib/*.dll build/ 2>/dev/null || true
          cd build
          (./wasmcart-run.exe ../test/snake.wasc > /tmp/smoke.log 2>&1 & PID=$!; sleep 3; kill $PID 2>/dev/null; wait $PID 2>/dev/null) || true
          if grep -q "loaded snake" /tmp/smoke.log; then
            echo "PASS: V8 initialized, cart loaded"
          else
            echo "FAIL: cart did not load"
            cat /tmp/smoke.log
            exit 1
          fi
      # dawn.node delay-loads Node-API from "node.exe", resolved to this
      # executable, which must export all of it.
      - name: WebGPU exports
        run: node test/wgpu_exports.mjs build/wasmcart-run.exe
      # The runner has no GPU; Dawn's D3D12 backend uses WARP, Windows'
      # software adapter. SDL's Windows build has no offscreen driver, so the
      # cart presents into a real window.
      - name: WebGPU smoke test
        shell: bash
        env:
          WGPU_SMOKE_VIDEODRIVER: windows
        run: sh test/wgpu_smoke.sh build/wasmcart-run.exe
      - name: Package
        shell: bash
        run: |
          cd build
          7z a ../wasmcart-native-windows-aarch64.zip wasmcart-run.exe SDL2.dll libEGL.dll libGLESv2.dll wgpu
      - uses: actions/upload-artifact@v7
        with:
          name: wasmcart-native-windows-aarch64
          path: wasmcart-native-windows-aarch64.zip

  release:
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos-x86_64, build-macos-aarch64, build-windows-x86_64, build-windows-aarch64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "wasmcart-native ${{ github.ref_name }}"
          body: |
            Standalone wasmcart player. Runs `.wasc` game carts with V8 (instant WASM startup), SDL2, and EGL/GLES3.

            Download for your platform and run:
            ```
            ./wasmcart-run game.wasc
            ./wasmcart-run game.wasc --res 1920x1080
            ./wasmcart-run game.wasc --fps --uncapped
            ```

            macOS and Windows include ANGLE (libEGL + libGLESv2) for GLES3 support.

            WebGPU carts (wasmcart ${{ env.WASMCART_VERSION }}, Dawn from native-dawn ${{ env.NATIVE_DAWN_VERSION }}) run on every build: keep the `wgpu/` directory beside `wasmcart-run`. Linux uses Vulkan, macOS Metal, Windows D3D12.
          files: |
            artifacts/wasmcart-native-linux-x86_64/*.tar.gz
            artifacts/wasmcart-native-linux-aarch64/*.tar.gz
            artifacts/wasmcart-native-macos-x86_64/*.tar.gz
            artifacts/wasmcart-native-macos-aarch64/*.tar.gz
            artifacts/wasmcart-native-windows-x86_64/*.zip
            artifacts/wasmcart-native-windows-aarch64/*.zip
