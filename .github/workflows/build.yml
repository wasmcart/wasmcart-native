name: Build wasmcart-native

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  LIBNODE_VERSION: v24.14.1

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y cmake g++ \
            libsdl2-dev libegl-dev libgles-dev \
            libasound2-dev libpulse-dev libsamplerate0-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev libdrm-dev libgbm-dev
      - name: Download libnode
        run: |
          mkdir -p deps/libnode
          curl -sL https://github.com/wasmcart/build-libnode/releases/download/${{ env.LIBNODE_VERSION }}/libnode-linux-x86_64.tar.gz | tar xz -C deps/libnode
      - name: Build
        run: mkdir build && cd build && cmake .. && make -j$(nproc)
      - name: Package
        run: |
          strip build/wasmcart-run
          tar czf wasmcart-native-linux-x86_64.tar.gz -C build wasmcart-run
      - uses: actions/upload-artifact@v7
        with:
          name: wasmcart-native-linux-x86_64
          path: wasmcart-native-linux-x86_64.tar.gz

  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y cmake g++ \
            libsdl2-dev libegl-dev libgles-dev \
            libasound2-dev libpulse-dev libsamplerate0-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev libdrm-dev libgbm-dev
      - name: Download libnode
        run: |
          mkdir -p deps/libnode
          curl -sL https://github.com/wasmcart/build-libnode/releases/download/${{ env.LIBNODE_VERSION }}/libnode-linux-aarch64.tar.gz | tar xz -C deps/libnode
      - name: Build
        run: mkdir build && cd build && cmake .. && make -j$(nproc)
      - name: Package
        run: |
          strip build/wasmcart-run
          tar czf wasmcart-native-linux-aarch64.tar.gz -C build wasmcart-run
      - uses: actions/upload-artifact@v7
        with:
          name: wasmcart-native-linux-aarch64
          path: wasmcart-native-linux-aarch64.tar.gz

  build-macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: brew install cmake sdl2
      - name: Download libnode
        run: |
          mkdir -p deps/libnode
          curl -sL https://github.com/wasmcart/build-libnode/releases/download/${{ env.LIBNODE_VERSION }}/libnode-macos-x86_64.tar.gz | tar xz -C deps/libnode
      - name: Build
        run: mkdir build && cd build && cmake .. && make -j$(sysctl -n hw.ncpu)
      - name: Package
        run: |
          strip build/wasmcart-run
          tar czf wasmcart-native-macos-x86_64.tar.gz -C build wasmcart-run
      - uses: actions/upload-artifact@v7
        with:
          name: wasmcart-native-macos-x86_64
          path: wasmcart-native-macos-x86_64.tar.gz

  build-macos-aarch64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: brew install cmake sdl2
      - name: Download libnode
        run: |
          mkdir -p deps/libnode
          curl -sL https://github.com/wasmcart/build-libnode/releases/download/${{ env.LIBNODE_VERSION }}/libnode-macos-aarch64.tar.gz | tar xz -C deps/libnode
      - name: Build
        run: mkdir build && cd build && cmake .. && make -j$(sysctl -n hw.ncpu)
      - name: Package
        run: |
          strip build/wasmcart-run
          tar czf wasmcart-native-macos-aarch64.tar.gz -C build wasmcart-run
      - uses: actions/upload-artifact@v7
        with:
          name: wasmcart-native-macos-aarch64
          path: wasmcart-native-macos-aarch64.tar.gz

  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install SDL2
        shell: bash
        run: |
          curl -sL https://github.com/libsdl-org/SDL/releases/download/release-2.32.4/SDL2-devel-2.32.4-VC.zip -o sdl2.zip
          unzip -q sdl2.zip -d deps/
          mv deps/SDL2-2.32.4 deps/SDL2
      - name: Download libnode
        shell: bash
        run: |
          mkdir -p deps/libnode
          curl -sL https://github.com/wasmcart/build-libnode/releases/download/${{ env.LIBNODE_VERSION }}/libnode-windows-x86_64.zip -o libnode.zip
          unzip -q libnode.zip -d deps/libnode
      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake .. -DSDL2_DIR=..\deps\SDL2\cmake -DLIBNODE_DIR=..\deps\libnode
          cmake --build . --config Release
      - name: Package
        shell: bash
        run: |
          cp deps/SDL2/lib/x64/SDL2.dll build/Release/ 2>/dev/null || true
          cd build/Release
          7z a ../../wasmcart-native-windows-x86_64.zip wasmcart-run.exe SDL2.dll
      - uses: actions/upload-artifact@v7
        with:
          name: wasmcart-native-windows-x86_64
          path: wasmcart-native-windows-x86_64.zip

  release:
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos-x86_64, build-macos-aarch64, build-windows-x86_64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "wasmcart-native ${{ github.ref_name }}"
          body: |
            Standalone wasmcart player. Runs `.wasc` game carts with V8 (instant WASM startup), SDL2, and EGL/GLES3.

            Download for your platform and run:
            ```
            ./wasmcart-run game.wasc
            ./wasmcart-run game.wasc --res 1920x1080
            ./wasmcart-run game.wasc --fps --uncapped
            ```
          files: |
            artifacts/wasmcart-native-linux-x86_64/*.tar.gz
            artifacts/wasmcart-native-linux-aarch64/*.tar.gz
            artifacts/wasmcart-native-macos-x86_64/*.tar.gz
            artifacts/wasmcart-native-macos-aarch64/*.tar.gz
            artifacts/wasmcart-native-windows-x86_64/*.zip
